<!DOCTYPE html>
<html>
  <head>
    <title>My experiment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Länkar till jspsych biblioteket och de plugins som behövs för att skapa och köra experimentet. De specifika versionerna av jspsych och dess plugins anges i URL:erna-->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>

<style>
  /* Grundstorlek för text på alla enheter */
  body {
    font-size: 16px;
  }

  /* jsPsych centrerar text som standard - vi skriver över det så allt är vänsterställt */
  .jspsych-content {
    text-align: left;
    max-width: 650px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Continue-knappen - centrerad och stor nog för touch (minst 44px enligt Apples riktlinjer) */
  .jspsych-btn {
    display: block !important;
    margin: 20px auto 50px !important;
    font-size: 16px !important;
    min-height: 44px;
    background-color: #875E29;
    color: white;
    width: 140px;
    height: 36px;
    border: none;
    border-radius: 0;
    line-height: 36px;
  }
  /* hover färgen över fortsättknappen*/
  .jspsych-btn:hover {
  background-color: #6C4B21;
  text-decoration: underline;
  }

  /* Centrerar knapp-containern för html-button-response-sidor (påverkar inte survey-likert) */
  #jspsych-html-button-response-btngroup {
    display: flex;
    justify-content: center;
  }

  /* Textsidan - läsbar på alla skärmstorlekar */
  .text-content {
    line-height: 1.8;
  }

  .text-content p {
    margin-bottom: 1em; /* Tydliga styckebrytningar */
  }

  /* Lista med alternativ istället för rutnät */
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(90vw, 420px);
    margin: 20px auto;
  }

  .mouselab-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    font-size: 16px;
    font-weight: 700;
    background-color: #DCEBF0;
    cursor: pointer;
    padding: 16px 18px;
    min-height: 56px;
    -webkit-tap-highlight-color: transparent;
  }

  .mouselab-option:hover {
    background-color: #F1F7F9;
  }

  .mouselab-option span {
    flex: 1;
  }

  /* Modalen - täcker hela skärmen med en halvtransparent bakgrund */
  #info-modal {
    display: none;                         /* Dold som standard, visas via JS */
    position: fixed;
    inset: 0;                              /* Täcker hela viewport */
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Modalens innehållsruta */
  #modal-content {
    background: white;
    border-radius: 12px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    font-size: 16px;
    line-height: 1.6;
  }

  /* Varje informationsbit med sin slider */
  .info-item {
    margin-bottom: 20px;
    background-color: #DCEBF0;
    padding: 16px 18px;
    min-height: 72px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
  }

  .info-item strong {
    display: block;
    margin-bottom: 10px;
    font-size: 16px;
    color: #222;
  }

  .info-item p {
    margin: 0 0 18px;
    color: #444;
    line-height: 1.5;
  }

  /* Slider-container: input ovanför, etiketter under */
  .slider-wrapper {
    display: flex;
    flex-direction: column;
    margin-top: 20px;
  }

  .slider-wrapper input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }

  /* Spåret – tunn grå linje */
  .slider-wrapper input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #333;
    border-radius: 0;
  }

  /* Tummen – vit cirkel med grå kant */
  .slider-wrapper input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    border: 2px solid #333;
    margin-top: -9px;
  }

  /* Etiketter under slidern, utspridda till ändarna */
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #444;
    margin-top: 4px;
  }

  /* Stängknappen i modalen */
  #modal-close {
    display: block;
    margin: 16px auto 0;
    font-size: 16px;
    cursor: pointer;
    min-height: 44px;
    background-color: #875E29;
    color: white;
    width: 140px;
    height: 36px;
    border: none;
    border-radius: 0;
    line-height: 36px;
  }

  #modal-close:hover {
    background-color: #6C4B21;
    text-decoration: underline;
  }

</style>

 </head>
  <body>
  </body>
  <script>

    //initierar jsPsych och anger en on_finish funktion som kommer att köras när experimentet är klart. 
    var jsPsych = initJsPsych({
      //on_finish funktionen kommer att spara all data som samlats in under experimentet i en CSV-fil med namnet 'mouselab_data.csv'. Den hämtar all data från jsPsychs dataobjekt, konverterar det till CSV-format och sparar det lokalt på användarens dator.
      on_finish: () => {
        jsPsych.data.get()
        .ignore('stimulus')
        .ignore('trial_index')
        .ignore('time_elapsed')
        .ignore('internal_node_id')
        .ignore('question_order')
        .localSave('csv', 'mouselab_data.csv');
      },
    });

    /* Timeline är en array som innehåller alla delar av experimentet i den ordning de ska visas. Varje del är ett objekt som beskriver vilken typ av stimuli som ska visas, vilka frågor som ska ställas, och eventuella funktioner som ska köras när delen startar eller avslutas.*/
    var timeline = [];

    /*startar när sidan laddas och avslutas när man trycker på continue på förstasidan
     variabeln definieras som ett objekt med innehållet på den första sidan i experimentet*/
    var welcome = {
        type: jsPsychHtmlButtonResponse,
        stimulus: "Välkommen. Du kommer nu att få delta i ett experiment om beslutsfattande. Du kommer att få läsa en text och sedan svara på frågor... LÄGG TILL RÄTT TEXT",
        choices: ["Fortsätt"]
    };

    /* här definieras objektet text page som är delen i experimentet som randomiserar och visar den neútrala eller emotionella berättelsen. Den hämtar texten med fetch som är en asynkron funktion och körs sist. */
    var text_page;

    /* Ny sida för trovärdighet och flyktingstatus med sliders */
    var credibility_page;
    /* variabeln clickData definieras som en tom array som kommer att användas för att lagra data om hur länge deltagaren klickar på varje cirkelalternativ i den kommande delen av experimentet. När deltagaren interagerar med cirkelalternativen, kommer information om vilken cirkel de klickar på och hur länge de gör det att sparas i denna array.*/
    var clickData = [];
    var clickOrder = [];
    var currentStartTime = 0;
    var currentWordCount = 0;

    /* mouselab_list och survey definieras inuti fetch-callbacken eftersom de
       bygger på data från JSON-filen. Variablerna deklareras här så att de
       är tillgängliga när timeline byggs. */
    var mouselab_list;
    //surveyn på sista sidan där användaren får svara på frågor om rekryteringsbelsut och vilka informationskällor som var mest relevanta för beslutet. Denna del använder sig av en textbaserad enkät där deltagaren kan skriva sina svar i textfält. Svaren sparas som experimentets data i csv-filen.
    var survey;

    //hämtar texterna från JSON-filen
    fetch('texts.json')
      .then(response => response.json())
      .then(data => {
        //slumpar vilket av de två textalternativen deltagaren får se
        const randomIndex = Math.floor(Math.random() * data.texts.length);
        const selectedText = data.texts[randomIndex];

        //skapar textsidan med den slumpade texten
        text_page = {
          type: jsPsychHtmlButtonResponse,
          /* Delar upp texten i stycken vid \n och renderar dem som <p>-taggar */
          stimulus: `<div class="text-content"><p>${selectedText.content.replace(/\n/g, '</p><p>')}</p></div>`,
          choices: ["Fortsätt"],
          save_trial_parameters: { stimulus: false },
          data: { assigned_text: selectedText.id }
        };

        /* Skapa credibility_page med sliders för trovärdighet och flyktingstatus */
        let credibilityValue = 5.5;
        let refugeeValue = 5.5;
        const credibilityHTML = `
          <div class="info-item">
            <p>Hur trovärdig tyckte du att Haile Gebremedhin verkade?</p>
            <div class="slider-wrapper">
              <input type="range" id="credibility-slider" min="1" max="10" value="5.5" step="any">
              <div class="slider-labels">
                <span>Inte alls trovärdig</span>
                <span>Mycket trovärdig</span>
              </div>
            </div>
          </div>
          <div class="info-item">
            <p>Baserat på det du läst - anser du att Haile Gebremedhin bör få flyktingstatus i Sverige?</p>
            <div class="slider-wrapper">
              <input type="range" id="refugee-slider" min="1" max="10" value="5.5" step="any">
              <div class="slider-labels">
                <span>Nej</span>
                <span>Ja</span>
              </div>
            </div>
          </div>
        `;
        credibility_page = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `<h3>Vänligen svara på följande frågor</h3><div class="text-content">${credibilityHTML}</div><p id="credibility-warning" style="color:#b22020; display:none; margin-top: 10px;">Du måste justera alla reglage innan du kan gå vidare.</p>`,
          choices: ["Fortsätt"],
          on_load: function() {
            const continueButton = document.querySelector('#jspsych-html-button-response-btngroup button');
            const warning = document.getElementById('credibility-warning');
            let credibilityTouched = false;
            let refugeeTouched = false;

            function updateContinueState() {
              const allTouched = credibilityTouched && refugeeTouched;
              continueButton.disabled = !allTouched;
              if (!allTouched) {
                continueButton.style.opacity = '0.6';
                continueButton.style.cursor = 'not-allowed';
              } else {
                continueButton.style.opacity = '1';
                continueButton.style.cursor = 'pointer';
                warning.style.display = 'none';
              }
            }

            updateContinueState();

            document.getElementById('credibility-slider').addEventListener('input', (event) => {
              credibilityValue = parseFloat(parseFloat(event.target.value).toFixed(2));
              credibilityTouched = true;
              updateContinueState();
            });

            document.getElementById('refugee-slider').addEventListener('input', (event) => {
              refugeeValue = parseFloat(parseFloat(event.target.value).toFixed(2));
              refugeeTouched = true;
              updateContinueState();
            });

            continueButton.addEventListener('click', (event) => {
              if (!(credibilityTouched && refugeeTouched)) {
                event.preventDefault();
                warning.style.display = 'block';
              }
            });
          },
          on_finish: function(data) {
            data.credibility = credibilityValue;
            data.refugee_status = refugeeValue;
          }
        };

        /* Skapa en andra credibility_page efter survey */
        let credibilityValue2 = 5.5;
        let refugeeValue2 = 5.5;
        const credibilityHTML2 = `
          <div class="info-item">
            <p>Hur trovärdig tyckte du att Haile Gebremedhin verkade?</p>
            <div class="slider-wrapper">
              <input type="range" id="credibility-slider2" min="1" max="10" value="5.5" step="any">
              <div class="slider-labels">
                <span>Inte alls trovärdig</span>
                <span>Mycket trovärdig</span>
              </div>
            </div>
          </div>
          <div class="info-item">
            <p>Baserat på det du läst - anser du att Haile Gebremedhin bör få flyktingstatus i Sverige?</p>
            <div class="slider-wrapper">
              <input type="range" id="refugee-slider2" min="1" max="10" value="5.5" step="any">
              <div class="slider-labels">
                <span>Nej</span>
                <span>Ja</span>
              </div>
            </div>
          </div>
        `;
        const credibility_page2 = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `<h3>Vänligen svara på följande frågor</h3><div class="text-content">${credibilityHTML2}</div><p id="credibility-warning2" style="color:#b22020; display:none; margin-top: 10px;">Du måste justera alla reglage innan du kan gå vidare.</p>`,
          choices: ["Fortsätt"],
          on_load: function() {
            const continueButton = document.querySelector('#jspsych-html-button-response-btngroup button');
            const warning = document.getElementById('credibility-warning2');
            let credibilityTouched2 = false;
            let refugeeTouched2 = false;

            function updateContinueState() {
              const allTouched = credibilityTouched2 && refugeeTouched2;
              continueButton.disabled = !allTouched;
              if (!allTouched) {
                continueButton.style.opacity = '0.6';
                continueButton.style.cursor = 'not-allowed';
              } else {
                continueButton.style.opacity = '1';
                continueButton.style.cursor = 'pointer';
                warning.style.display = 'none';
              }
            }

            updateContinueState();

            document.getElementById('credibility-slider2').addEventListener('input', (event) => {
              credibilityValue2 = parseFloat(parseFloat(event.target.value).toFixed(2));
              credibilityTouched2 = true;
              updateContinueState();
            });

            document.getElementById('refugee-slider2').addEventListener('input', (event) => {
              refugeeValue2 = parseFloat(parseFloat(event.target.value).toFixed(2));
              refugeeTouched2 = true;
              updateContinueState();
            });

            continueButton.addEventListener('click', (event) => {
              if (!(credibilityTouched2 && refugeeTouched2)) {
                event.preventDefault();
                warning.style.display = 'block';
              }
            });
          },
          on_finish: function(data) {
            data.credibility_post = credibilityValue2;
            data.refugee_status_post = refugeeValue2;
          }
        };

        /* Helper: blandar en array in-place med Fisher-Yates. */
        function shuffleArray(array) {
          for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;
        }

        /* Slumpa om options så att varje deltagare får ny ordning, men samma ordning
           används både i listan och på slider-sidan. */
        const randomizedOptions = shuffleArray(data.options.slice());

        /* Bygg infoData som ett objekt från den randomiserade options-arrayen.
           Nyckeln är knappens id och värdet är beskrivningstexten. */
        const infoData = {};
        randomizedOptions.forEach(opt => {
          infoData[opt.id] = opt.description;
        });

        /* Bygg HTML för varje knapp från den randomiserade options-arrayen. */
        const optionDivs = randomizedOptions.map(opt =>
          `<button class="mouselab-option" id="${opt.id}" type="button"><span>${opt.id}</span></button>`
        );

        /* Definiera mouselab_list med det dynamiskt byggda stimulus och
           on_load som använder infoData via closure från fetch-callbacken. */
        mouselab_list = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `
            <h3>Ytterligare information relaterat till berättelsen</h3>
            <p>Tryck på knapparna för att ta del av informationen</p>
            <div class="option-list">
              ${optionDivs.join('\n              ')}
            </div>
            <div id="info-modal">
              <div id="modal-content">
                <p id="modal-text"></p>
                <button id="modal-close" type="button">Stäng</button>
              </div>
            </div>
          `,
          choices: ["Fortsätt"],
          on_load: function () {
            /* Varje knapp öppnar modalen med sin matchande text från infoData */
            document.querySelectorAll(".mouselab-option").forEach((option) => {
              option.addEventListener("click", () => {
                clickOrder.push(option.id); /* Sparar varje klick, även upprepade */
                currentStartTime = Date.now();
                const text = infoData[option.id];
                currentWordCount = text.trim().split(/\s+/).length;
                document.getElementById("modal-text").textContent = text;
                document.getElementById("info-modal").style.display = "flex";
              });
            });

            /* Stängknappen sparar hur länge modalen var öppen och stänger den */
            document.getElementById("modal-close").addEventListener("click", () => {
              const duration = Date.now() - currentStartTime;
              const currentOption = clickOrder[clickOrder.length - 1];
              clickData.push({ option: currentOption, duration, wordCount: currentWordCount });
              document.getElementById("info-modal").style.display = "none";
            });
          },
          /* on_finish körs när deltagaren klickar på Fortsätt.
             Vi skriver direkt till det här trialens data-objekt istället för
             att använda addProperties(), som skulle lägga till värdena på
             alla rader i CSV-filen. */
          on_finish: function (data) {
            /* Konverterar clickData-arrayen till en JSON-sträng så att hela
               listan med {option, duration}-objekt får plats i en cell */
            data.clickData = JSON.stringify(clickData);
            /* Sparar klickordningen som en läsbar sträng, t.ex. "Minoriteten > Dialekt > Arresteringar" */
            data.clickOrder = clickOrder.join(' > ');
          }
        };

        /* Bygg en slider per alternativ: rubrik, beskrivning och range-input
           med etiketterna "Inte viktig" och "Mycket viktig" i ändarna */
        const sliderList = randomizedOptions.map(opt => `
          <div class="info-item">
            <strong>${opt.id}</strong>
            <p>${opt.description}</p>
            <div class="slider-wrapper">
              <input type="range" id="slider-${opt.id}" min="1" max="10" value="5.5" step="any">
              <div class="slider-labels">
                <span>Inte viktig</span>
                <span>Mycket viktig</span>
              </div>
            </div>
          </div>`
        ).join('');

        /* Initiera med startvärdet 5 för alla alternativ så att något sparas
           även om deltagaren inte rör en slider, men vi kräver aktiv interaktion.
           Det betyder att varje slider måste flyttas innan Fortsätt aktiveras. */
        const surveySliderValues = {};
        const sliderTouched = {};
        data.options.forEach(opt => {
          surveySliderValues[opt.id] = 5.5;
          sliderTouched[opt.id] = false;
        });

        survey = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `<h3>Hur viktig tycker du att den här biten information var för ditt beslut?</h3><div class="text-content">${sliderList}</div><p id="slider-warning" style="color:#b22020; display:none; margin-top: 10px;">Du måste justera alla reglage innan du kan gå vidare.</p>`,
          choices: ["Fortsätt"],
          /* Lyssnar på varje slider i realtid och uppdaterar surveySliderValues.
             on_finish läser DOM:en för sent – den är redan borta då. */
          on_load: function() {
            const continueButton = document.querySelector('#jspsych-html-button-response-btngroup button');
            const warning = document.getElementById('slider-warning');

            function updateContinueState() {
              const allTouched = Object.values(sliderTouched).every(v => v === true);
              continueButton.disabled = !allTouched;
              if (!allTouched) {
                continueButton.style.opacity = '0.6';
                continueButton.style.cursor = 'not-allowed';
              } else {
                continueButton.style.opacity = '1';
                continueButton.style.cursor = 'pointer';
                warning.style.display = 'none';
              }
            }

            updateContinueState();

            document.querySelectorAll('[id^="slider-"]').forEach(slider => {
              slider.addEventListener('input', () => {
                const id = slider.id.replace('slider-', '');
                surveySliderValues[id] = parseFloat(parseFloat(slider.value).toFixed(2));
                sliderTouched[id] = true;
                updateContinueState();
              });
            });

            continueButton.addEventListener('click', (event) => {
              const allTouched = Object.values(sliderTouched).every(v => v === true);
              if (!allTouched) {
                event.preventDefault();
                warning.style.display = 'block';
              }
            });
          },
          on_finish: function(data) {
            data.sliderValues = JSON.stringify(surveySliderValues);
          }
        };

        //lägger till alla sidor i rätt ordning och startar experimentet
        timeline.push(welcome, text_page, credibility_page, mouselab_list, credibility_page2, survey);
        jsPsych.run(timeline);
      });

</script>
</html>
