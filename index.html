<!DOCTYPE html>
<html>
  <head>
    <title>My experiment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Länkar till jspsych biblioteket och de plugins som behövs för att skapa och köra experimentet. De specifika versionerna av jspsych och dess plugins anges i URL:erna-->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>

<style>
  /* Grundstorlek för text på alla enheter */
  body {
    font-size: 16px;
  }

  /* jsPsych centrerar text som standard - vi skriver över det så allt är vänsterställt */
  .jspsych-content {
    text-align: left;
    max-width: 650px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Textsidan - läsbar på alla skärmstorlekar */
  .text-content {
    line-height: 1.8;
  }

  .text-content p {
    margin-bottom: 1em; /* Tydliga styckebrytningar */
  }

  /* Cirkelns storlek styrs av CSS-variabler som ändras per skärmstorlek.
     Basvärden gäller för mobil (mobile first). */
  :root {
    --circle-size: min(82vw, 320px);   /* Får plats på smal mobilskärm */
    --option-size: min(18vw, 68px);
    --distance: min(36vw, 132px);      /* Avstånd från centrum till knapp */
    --option-font: clamp(10px, 2.8vw, 13px);
    --desc-width: min(34vw, 130px);
    --desc-font: clamp(11px, 2vw, 14px);
  }

  /* Surfplatta */
  @media (min-width: 600px) {
    :root {
      --circle-size: 370px;
      --option-size: 74px;
      --distance: 152px;
      --option-font: 13px;
      --desc-width: 145px;
      --desc-font: 14px;
    }
  }

  /* Dator */
  @media (min-width: 900px) {
    :root {
      --circle-size: 400px;
      --option-size: 80px;
      --distance: 170px;
      --option-font: 14px;
      --desc-width: 160px;
      --desc-font: 15px;
    }
  }

  /* Cirkelbehållaren placeras i dokumentflödet (inte fixed) för att fungera bra på mobil */
  .circle-container {
    width: var(--circle-size);
    height: var(--circle-size);
    border-radius: 50%;
    position: relative;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Cirkelknapparna */
  .circle-container .circle-option {
    width: var(--option-size);
    height: var(--option-size);
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: var(--option-font);
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent; /* Tar bort blå highlight vid touch på iOS */
  }

  /* Positionerar knapparna runt cirkeln via rotation och translation */
  .option1 { transform: rotate(0deg) translate(var(--distance)) rotate(0deg); }
  .option2 { transform: rotate(45deg) translate(var(--distance)) rotate(-45deg); }
  .option3 { transform: rotate(90deg) translate(var(--distance)) rotate(-90deg); }
  .option4 { transform: rotate(135deg) translate(var(--distance)) rotate(-135deg); }
  .option5 { transform: rotate(180deg) translate(var(--distance)) rotate(-180deg); }
  .option6 { transform: rotate(225deg) translate(var(--distance)) rotate(-225deg); }
  .option7 { transform: rotate(270deg) translate(var(--distance)) rotate(-270deg); }
  .option8 { transform: rotate(315deg) translate(var(--distance)) rotate(-315deg); }

  /* Beskrivningsrutan i mitten av cirkeln */
  #description-box {
    position: absolute;
    width: var(--desc-width);
    height: auto;
    text-align: center;
    font-size: var(--desc-font);
    background-color: white;
    border: 1px solid black;
    border-radius: 10px;
    padding: 8px;
    z-index: 5;
  }

  /* Continue-knappen - stor nog för touch (minst 44px enligt Apples riktlinjer) */
  .jspsych-btn {
    padding: 14px 28px !important;
    font-size: 16px !important;
    margin-top: 20px;
    min-height: 44px;
  }
</style>

 </head>
  <body>
  </body>
  <script>

    //initierar jsPsych och anger en on_finish funktion som kommer att köras när experimentet är klart. 
    var jsPsych = initJsPsych({
      //on_finish funktionen kommer att spara all data som samlats in under experimentet i en CSV-fil med namnet 'mouselab_data.csv'. Den hämtar all data från jsPsychs dataobjekt, konverterar det till CSV-format och sparar det lokalt på användarens dator.
      on_finish: () => {
        jsPsych.data.get().localSave('csv', 'mouselab_data.csv');
        console.log("funktionen initJsPsych körs");
      },
    });

    /* Timeline är en array som innehåller alla delar av experimentet i den ordning de ska visas. Varje del är ett objekt som beskriver vilken typ av stimuli som ska visas, vilka frågor som ska ställas, och eventuella funktioner som ska köras när delen startar eller avslutas.*/
    var timeline = [];

    /*startar när sidan laddas och avslutas när man trycker på continue på förstasidan
     variabeln definieras som ett objekt med innehållet på den första sidan i experimentet*/
    var welcome = {
        type: jsPsychHtmlButtonResponse,
        stimulus: "Välkommen. Du kommer nu att få delta i ett experiment om beslutsfattande. Du kommer att få läsa en text och sedan svara på frågor... LÄGG TILL RÄTT TEXT",
        choices: ["Continue"]
    };

    var text_page;

    /* variabeln grading_scale definieras som ett objekt som beskriver en del av experimentet där deltagaren får bedöma sin attityd till kandidaten baserat på sin första intryck. Denna del använder sig av en Likert-skala där deltagaren kan välja mellan fem olika alternativ, från "Very negative" till "Very positive". När deltagaren har gjort sitt val och klickar på "Continue", kommer experimentet att gå vidare till nästa del.*/
    /*!!!! eventuellt ska vu byta dem mot en slide*/
    var grading_scale = {
      type: jsPsychSurveyLikert,
      preamble: "<h3>Based on your initial impression of the candidate, what is attitude towards hiring the person?</h3>",
      questions: [
        {
          prompt: "Rate your attitude towards hiring the person from negative to positive, in accordance with your first impression.",
          /*!!!Hur sparas denna variabel?*/
          labels: ["Very negative", "Negative", "Neutral", "Positive", "Very positive"],
          required: true
        }
      ],
      choices: ["Continue"]
    };
    /* variabeln hoverData definieras som en tom array som kommer att användas för att lagra data om hur länge deltagaren hovrar över varje cirkelalternativ i den kommande delen av experimentet. När deltagaren interagerar med cirkelalternativen, kommer information om vilken cirkel de hovrar över och hur länge de gör det att sparas i denna array.*/
    let hoverData = [];

    //circle_page objektet definieras
    var circle_page = {
      //egenskapen type sätts till en jspsych funktion som skapar knappar
     type: jsPsychHtmlButtonResponse,
     //detta står på knapparna
     stimulus: `
       <div class="circle-container">
       <div class="circle-option option1" id="Minoriteten">Minoriteten</div>
       <div class="circle-option option2" id="Regeringen">Regeringen</div>
       <div class="circle-option option3" id="Åtgärder">Åtgärder</div>
       <div class="circle-option option4" id="Polarisering">Polarisering</div>
       <div class="circle-option option5" id="Identitetshandlingar">Identitetshandlingar</div>
       <div class="circle-option option6" id="Dialekt">Dialekt</div>
       <div class="circle-option option7" id="Arresteringar">Arresteringar</div>
       <div class="circle-option option8" id="Krigsbrott">Krigsbrott</div>
       <div id="description-box">Touch/Hover to see details.</div>
     </div>
    `,
  
    choices: ["Continue"],
    //on_load funktionen ligger inne i objeketet circle_page för att köras när den sidan laddas
    on_load: function () {
      //Konstanten infoData är ett objekt som innehåller texten som visas när man hovrar över varje corkelalternativ. Varje nyckel i objektet motsvarar id:t för ett cirkelalternativ, och värdet är den text som ska visas i beskrivnings
      const infoData = {
        Minoriteten: "Det finns en muslimsk minoritet bland tigreanerna. ",
        Regeringen: "Hur starkt Etiopiens regering har agerat mot tigreaner har ändrat sig över tid, bland annat beroende på det tillfälliga läget i kriget i Tigray. Det kan alltså lätt förvärras igen. ",
        Åtgärder: "Enligt den senaste landinformationen om Etiopien har statens åtgärder mot tigreaner utanför Tigray främst handlat om arresteringar och kvarhållanden. Man har också använt sig av ekonomiska sanktioner och försvårat resor.",
        Polarisering: "Enligt den senaste landinformationen om Etiopien har polariseringen i det etiopiska samhället börjat öka, liksom samhällets fokus på etnicitet. ",
        Identitetshandlingar: "I Haile Gebremedhin identitetshandlingar framgår inte att hans etnicitet är tigreansk. ",
        Dialekt: "Haile Gebremedhin har ingen tigreansk dialekt, trots att det är känt att man i Tigray har en utpräglad och lättigenkännlig dialekt. ",
        Arresteringar: "Andelen arresteringar och kvarhållningar av tigreaner har enligt landinformationen minskat sedan början av 2022. Efter hösten 2022 finns ingen information om mass-arresteringar av tigreaner i Etiopien.",
        Krigsbrott: "Det är enbart i regionen Tigray det finns kännedom om grova krigsbrott i dagsläget.",
      };
      //document söker i htmln, queryselectorAll väljer det element som har klassen circle-option, for each loopar igenom alla dessa element
     document.querySelectorAll(".circle-option").forEach((option) => {
       let startTime = 0;
       //och lägger till event listeners för mouseover
       option.addEventListener("mouseover", (event) => {
         const id = event.target.id;
         startTime = Date.now();
         //Hittar diven med idt description box oxh lägger in texten som motsvarar det cirkelalternativ som musen hovrar över. Texten hämtas från infoData-objektet där nyckeln är id:t för det cirkelalternativ som hovras över. 
         document.getElementById("description-box").textContent = infoData[id];
       });
       //och lägger till event listeners för mouseout
       option.addEventListener("mouseout", (event) => {
         const id = event.target.id;
         const duration = Date.now() - startTime;
        
         //När musen lämnar ett cirkelalternativ, beräknas hur länge den har hovrat över det genom att ta skillnaden mellan det aktuella datumet och startTime. Denna information, tillsammans med id:t för det cirkelalternativ som lämnades, sparas sedan i hoverData-arrayen som ett objekt med egenskaperna option och hoverDuration. 
         hoverData.push({
           option: id,
           hoverDuration: duration,
         });
        //Efter att ha sparat hoverdata, återställs texten i beskrivningsrutan till det ursprungliga meddelandet "Hover over an option to see details.", vilket uppmanar deltagaren att fortsätta interagera med cirkelalternativen.
         document.getElementById("description-box").textContent =
          "Hover over an option to see details.";
       });
       });
     },
     //när användaren klickar på continue körs on_finish funktionen som lägger till hoverData som en egenskap i jsPsychs dataobjekt
     on_finish: function () {
       jsPsych.data.addProperties({ hoverData });
     },
  };
    //surveyn på sista sidan där användaren får svara på frågor om rekryteringsbelsut och vilka informationskällor som var mest relevanta för beslutet. Denna del använder sig av en textbaserad enkät där deltagaren kan skriva sina svar i textfält. Svaren sparas som experimentets data i csv-filen.
    var survey = {
        type: jsPsychSurveyText,
        questions: [{ 
          prompt: "Do you want to recruit the candidate?"}, 
        { prompt: "Motivate your decision.", rows: 5}, 
        {prompt: "In the prior page, you were able to find information about the candidate's experience, motivation, skills, and education. Please write these sources down in a list from 1 to 4, in order of the relevance you believe they had to the recruitment decision.", 
        rows: 2}]
    };

    //hämtar texterna från JSON-filen
    fetch('texts.json')
      .then(response => response.json())
      .then(data => {
        //slumpar vilket av de två textalternativen deltagaren får se
        const randomIndex = Math.floor(Math.random() * data.texts.length);
        const selectedText = data.texts[randomIndex];

        //skapar textsidan med den slumpade texten
        text_page = {
          type: jsPsychHtmlButtonResponse,
          /* Delar upp texten i stycken vid \n och renderar dem som <p>-taggar */
          stimulus: `<div class="text-content"><p>${selectedText.content.replace(/\n/g, '</p><p>')}</p></div>`,
          choices: ["Continue"],
          save_trial_parameters: { stimulus: false },
          data: { assigned_text: selectedText.id }
        };

        //lägger till alla sidor i rätt ordning och startar experimentet
        timeline.push(welcome, text_page, grading_scale, circle_page, survey);
        jsPsych.run(timeline);
      });

</script>
</html>
